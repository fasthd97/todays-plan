<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7a7a7a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Today's Plan</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <div class="status-indicator" id="statusIndicator">Not connected</div>
    <button class="theme-toggle" id="themeToggle" title="Toggle dark mode">🌙</button>

    <div class="auth-section hidden" id="authSection">
        <div class="auth-box">
            <h2 id="authTitle">Sign in to sync across devices</h2>
            <input type="email" class="auth-input" id="authEmail" placeholder="Email">
            <input type="password" class="auth-input" id="authPassword" placeholder="Password">
            <button class="auth-btn" id="authSubmit">Sign In</button>
            <div class="auth-toggle">
                <span id="authToggleText">Don't have an account?</span>
                <a id="authToggleLink">Sign up</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>today's plan</h1>
            <div class="date-section">
                <div class="date-label">DATE</div>
                <input type="date" class="date-input" id="dateInput">
                <div class="days">
                    <label class="day-checkbox"><span class="day-label">MON</span><input type="checkbox" id="mon"></label>
                    <label class="day-checkbox"><span class="day-label">TUE</span><input type="checkbox" id="tue"></label>
                    <label class="day-checkbox"><span class="day-label">WED</span><input type="checkbox" id="wed"></label>
                    <label class="day-checkbox"><span class="day-label">THU</span><input type="checkbox" id="thu"></label>
                    <label class="day-checkbox"><span class="day-label">FRI</span><input type="checkbox" id="fri"></label>
                    <label class="day-checkbox"><span class="day-label">SAT</span><input type="checkbox" id="sat"></label>
                    <label class="day-checkbox"><span class="day-label">SUN</span><input type="checkbox" id="sun"></label>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="schedule-section">
                <div class="section-title">schedule</div>
                <div id="scheduleList"></div>
            </div>

            <div>
                <div class="priorities-section">
                    <div class="section-title">priorities</div>
                    <div class="priority-item">
                        <div class="priority-number">1</div>
                        <input type="text" class="priority-input" id="priority1">
                    </div>
                    <div class="priority-item">
                        <div class="priority-number">2</div>
                        <input type="text" class="priority-input" id="priority2">
                    </div>
                    <div class="priority-item">
                        <div class="priority-number">3</div>
                        <input type="text" class="priority-input" id="priority3">
                    </div>
                </div>

                <div class="other-tasks-section">
                    <div class="section-title">other tasks</div>
                    <div id="tasksList"></div>
                </div>
            </div>

            <div class="notes-section">
                <div class="section-title">notes</div>
                <textarea class="notes-textarea" id="notes"></textarea>
            </div>
        </div>

        <div class="water-section">
            <div class="section-title">water</div>
            <div class="water-tracker">
                <label class="water-item"><input type="checkbox" class="water-checkbox" id="water1"><span class="water-label">1</span></label>
                <label class="water-item"><input type="checkbox" class="water-checkbox" id="water2"><span class="water-label">2</span></label>
                <label class="water-item"><input type="checkbox" class="water-checkbox" id="water3"><span class="water-label">3</span></label>
                <label class="water-item"><input type="checkbox" class="water-checkbox" id="water4"><span class="water-label">4</span></label>
                <label class="water-item"><input type="checkbox" class="water-checkbox" id="water5"><span class="water-label">5</span></label>
                <label class="water-item"><input type="checkbox" class="water-checkbox" id="water6"><span class="water-label">6</span></label>
                <label class="water-item"><input type="checkbox" class="water-checkbox" id="water7"><span class="water-label">7</span></label>
                <label class="water-item"><input type="checkbox" class="water-checkbox" id="water8"><span class="water-label">8</span></label>
            </div>
        </div>

        <div class="buttons">
            <button class="roll-forward-btn" onclick="rollForward()">Roll to Tomorrow</button>
            <button onclick="window.print()">Print</button>
            <button onclick="clearAll()">Clear All</button>
            <button onclick="signOut()">Sign Out</button>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
